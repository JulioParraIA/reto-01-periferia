<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro como proveedor</title>
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body data-vista="chat">
    <header class="barra">
      <div class="marca">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" />
          <path d="M9 23V9h7.5a4.5 4.5 0 0 1 0 9H13v5" />
        </svg>
        <div>
          <h1>Registro como proveedor</h1>
          <p class="subtitulo">Periferia IT Group · agente de registro ante clientes</p>
        </div>
      </div>
      <nav class="pestanas" aria-label="Vistas">
        <button type="button" data-vista="chat" aria-pressed="true">Chat</button>
        <button type="button" data-vista="expediente" aria-pressed="false">Expediente</button>
        <button type="button" data-vista="consumo" aria-pressed="false">Consumo</button>
      </nav>
      <div class="acciones-barra">
        <span id="chip-modelo" class="chip-modelo" title="Modelo que responde">conectando…</span>
        <button id="nueva" class="boton secundario" type="button">Nueva sesión</button>
      </div>
    </header>

    <div class="app">
      <section class="panel panel-chat" aria-label="Conversación con el agente">
        <div id="conversacion" class="conversacion" aria-live="polite"></div>
        <form id="formulario" class="compositor">
          <textarea id="mensaje" rows="1" placeholder="Escribe una instrucción, por ejemplo: procesa el caso co-industrias-delta" aria-label="Mensaje para el agente"></textarea>
          <button id="enviar" class="boton primario" type="submit" aria-label="Enviar mensaje">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" /></svg>
          </button>
        </form>
      </section>

      <aside class="panel panel-lateral" aria-label="Expediente del caso y consumo">
        <section id="expediente" class="expediente"></section>
        <section id="consola" class="consola" aria-label="Consumo del modelo">
          <header class="consola-cabecera">
            <span><span class="punto"></span> consumo del modelo</span>
            <button id="plegar-consola" type="button" aria-expanded="true" title="Plegar o desplegar">–</button>
          </header>
          <div id="consola-cuerpo" class="consola-cuerpo"></div>
        </section>
      </aside>
    </div>

    <div id="acceso" class="modal" hidden>
      <form class="modal-caja pequena" id="form-acceso">
        <h2>Enlace protegido</h2>
        <p>Escribe la clave de acceso que viene en el README.</p>
        <input id="clave" type="password" autocomplete="current-password" required aria-label="Clave de acceso" />
        <button class="boton primario" type="submit">Entrar</button>
        <p id="error-acceso" class="texto-error" hidden>La clave no es correcta.</p>
      </form>
    </div>

    <div id="visor" class="modal" hidden>
      <div class="modal-caja grande" role="dialog" aria-modal="true" aria-labelledby="visor-titulo">
        <header class="modal-cabecera">
          <h2 id="visor-titulo">Vista previa</h2>
          <div class="fila">
            <button id="visor-descargar" class="boton secundario" type="button">Descargar</button>
            <button id="visor-cerrar" class="boton secundario" type="button" aria-label="Cerrar">✕</button>
          </div>
        </header>
        <div id="visor-contenido" class="visor-contenido"></div>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
